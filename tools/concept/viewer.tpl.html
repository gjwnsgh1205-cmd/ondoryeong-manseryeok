<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>온도령 — 컨셉 뷰어</title>
<style>
/* 고르는 화면이다. 그림 말고는 다 물러나 있어야 한다.
   그래서 배경은 거의 검정이고, 글자는 필요한 만큼만 띄운다. */
:root{
  color-scheme: dark;
  --bg:#0E0E12; --panel:#17171E; --line:#2A2A34;
  --ink:#E8E2D6; --dim:#9A9385; --gold:#E9C87A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,'Malgun Gothic',sans-serif;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ── 위 막대 ─────────────────────────────────────── */
.top{
  position:fixed; top:0; left:0; right:0; height:52px; z-index:10;
  display:flex; align-items:center; gap:.7rem; padding:0 .9rem;
  background:rgba(14,14,18,.86); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{font-weight:700; letter-spacing:.02em; white-space:nowrap}
.brand em{color:var(--gold); font-style:normal}
.seg{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden}
.seg button{padding:.32rem .8rem; font-size:.84rem; color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--gold); color:#191400; font-weight:700}
.grow{flex:1}
.count{font-size:.82rem; color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums}
.tbtn{padding:.34rem .7rem; border:1px solid var(--line); border-radius:8px; font-size:.82rem; color:var(--dim)}
.tbtn:hover{border-color:var(--gold); color:var(--gold)}

/* ── 무대 ────────────────────────────────────────── */
.stage{
  position:fixed; top:52px; left:0; right:0; bottom:104px;
  display:grid; place-items:center; padding:.8rem;
}
.stage img{
  max-width:100%; max-height:100%;
  border-radius:10px; display:block;
  box-shadow:0 1.2rem 3rem rgba(0,0,0,.6);
}
/* 좌우 절반을 눌러 넘긴다. 큰 화면에서 화살표를 찾아 누르는 것보다 빠르다. */
.nav{position:absolute; top:0; bottom:0; width:34%; z-index:3}
.nav.p{left:0} .nav.n{right:0}
.nav:hover{background:linear-gradient(90deg,rgba(233,200,122,.07),transparent)}
.nav.n:hover{background:linear-gradient(270deg,rgba(233,200,122,.07),transparent)}

/* 이름표 — 그림 위에 얹되 그림을 가리지 않게 아래로 */
.meta{
  position:absolute; left:50%; transform:translateX(-50%); bottom:.4rem;
  display:flex; align-items:center; gap:.6rem;
  padding:.4rem .9rem; border-radius:999px;
  background:rgba(14,14,18,.8); backdrop-filter:blur(8px);
  border:1px solid var(--line); white-space:nowrap;
}
.meta b{color:var(--gold); font-variant-numeric:tabular-nums}
.meta .pickbtn{font-size:1.15rem; line-height:1; filter:grayscale(1) opacity(.5)}
.meta .pickbtn.on{filter:none}

/* ── 아래 썸네일 줄 ──────────────────────────────── */
.rail{
  position:fixed; left:0; right:0; bottom:0; height:104px; z-index:10;
  display:flex; gap:6px; align-items:center;
  padding:0 .6rem; overflow-x:auto; overscroll-behavior-x:contain;
  background:rgba(14,14,18,.9); backdrop-filter:blur(10px);
  border-top:1px solid var(--line); scrollbar-width:thin;
}
.rail figure{margin:0; position:relative; flex:0 0 auto}
.rail img{
  height:80px; width:45px; object-fit:cover; display:block;
  border-radius:5px; border:2px solid transparent; background:var(--panel);
}
.rail figure[aria-current="true"] img{border-color:var(--gold)}
.rail figure.picked::after{
  content:'♥'; position:absolute; top:1px; right:2px;
  font-size:.7rem; color:var(--gold); text-shadow:0 0 3px #000;
}

/* ── 고른 것 ─────────────────────────────────────── */
.sheet{
  position:fixed; inset:0; z-index:20; display:none;
  background:rgba(10,10,13,.95); backdrop-filter:blur(6px);
  padding:1.2rem; overflow:auto;
}
.sheet.on{display:block}
.sheet h2{margin:.2rem 0 1rem; font-size:1rem}
.sheet .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.sheet .grid a{color:inherit; text-decoration:none; font-size:.78rem}
.sheet .grid img{width:100%; aspect-ratio:941/1672; object-fit:cover; border-radius:7px; display:block}
.sheet .grid span{display:block; padding:.3rem .1rem; color:var(--dim)}
.sheet textarea{
  width:100%; height:7rem; margin-top:1rem; padding:.7rem;
  background:var(--panel); color:var(--ink);
  border:1px solid var(--line); border-radius:8px;
  font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; resize:vertical;
}
.sheet .row{display:flex; gap:.5rem; margin-top:.7rem; flex-wrap:wrap}
.empty{color:var(--dim); padding:2rem 0}

.help{position:fixed; right:.9rem; bottom:112px; z-index:9; font-size:.72rem; color:var(--dim); text-align:right; pointer-events:none}
.help kbd{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:0 .3rem; font:inherit}

@media (max-width:600px){
  .brand span{display:none}
  .stage{bottom:92px} .rail{height:92px} .rail img{height:70px;width:39px}
  .help{display:none}
}
</style>
</head>
<body>

<div class="top">
  <div class="brand">온도령 <em>컨셉 60</em></div>
  <div class="seg" id="seg">
    <button data-f="all" aria-pressed="true">전체</button>
    <button data-f="M" aria-pressed="false">남</button>
    <button data-f="F" aria-pressed="false">여</button>
    <button data-f="pick" aria-pressed="false">♥</button>
  </div>
  <span class="grow"></span>
  <span class="count" id="count"></span>
  <button class="tbtn" id="open-sheet">고른 것</button>
</div>

<div class="stage" id="stage">
  <button class="nav p" id="prev" aria-label="이전"></button>
  <img id="big" alt="">
  <button class="nav n" id="next" aria-label="다음"></button>
  <div class="meta">
    <b id="m-id"></b><span id="m-name"></span>
    <button class="pickbtn" id="pick" title="고르기 (F)">♥</button>
  </div>
</div>

<div class="help"><kbd>←</kbd><kbd>→</kbd> 넘기기 · <kbd>F</kbd> 고르기</div>

<div class="rail" id="rail"></div>

<div class="sheet" id="sheet">
  <h2>고른 것 <span id="pick-n" class="count"></span>
    <button class="tbtn" id="close-sheet" style="float:right">닫기</button></h2>
  <div class="grid" id="pick-grid"></div>
  <p class="empty" id="pick-empty">아직 고른 게 없어요. 그림을 넘기다 <b>♥</b> 를 누르거나 <kbd>F</kbd> 를 치세요.</p>
  <textarea id="pick-text" readonly></textarea>
  <div class="row">
    <button class="tbtn" id="copy">목록 복사</button>
    <button class="tbtn" id="clear">전부 지우기</button>
  </div>
</div>

<script>
const DATA = /*__DATA__*/[];
const KEY = 'ondoryeong.concept.pick.v1';
const $ = (id) => document.getElementById(id);

let picks = new Set();
try { picks = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...picks])); } catch (e) {} };

let filter = 'all';
let list = [];
let i = 0;

const src = (id) => `assets/concept/${id}.png`;

function applyFilter(keepId) {
  list = DATA.filter((d) => filter === 'all' ? true : filter === 'pick' ? picks.has(d.id) : d.s === filter);
  if (!list.length) list = DATA.slice();          // ♥가 비었을 때 빈 화면이 되지 않게
  const at = list.findIndex((d) => d.id === keepId);
  i = at >= 0 ? at : 0;
  buildRail();
  show();
}

function buildRail() {
  const rail = $('rail');
  rail.innerHTML = list.map((d, n) => `
    <figure data-n="${n}" class="${picks.has(d.id) ? 'picked' : ''}" aria-current="${n === i}">
      <img src="${src(d.id)}" loading="lazy" alt="${d.id} ${d.n}" title="${d.id} ${d.n}">
    </figure>`).join('');
}

/* 앞뒤 한 장씩 미리 받아둔다. 안 그러면 넘길 때마다 흰 칸이 번쩍인다. */
function preload(n) {
  [n - 1, n + 1].forEach((k) => {
    if (k >= 0 && k < list.length) { const im = new Image(); im.src = src(list[k].id); }
  });
}

function show() {
  const d = list[i];
  if (!d) return;
  $('big').src = src(d.id);
  $('big').alt = `${d.id} ${d.n}`;
  $('m-id').textContent = d.id;
  $('m-name').textContent = d.n;
  $('pick').classList.toggle('on', picks.has(d.id));
  $('count').textContent = `${i + 1} / ${list.length}`;
  [...$('rail').children].forEach((f, n) => f.setAttribute('aria-current', String(n === i)));
  const cur = $('rail').children[i];
  if (cur) cur.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  preload(i);
}

const go = (step) => { i = (i + step + list.length) % list.length; show(); };

function togglePick() {
  const d = list[i]; if (!d) return;
  picks.has(d.id) ? picks.delete(d.id) : picks.add(d.id);
  save();
  $('pick').classList.toggle('on', picks.has(d.id));
  const fig = $('rail').children[i];
  if (fig) fig.classList.toggle('picked', picks.has(d.id));
}

/* ── 손잡이 ── */
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('pick').onclick = (e) => { e.stopPropagation(); togglePick(); };

$('rail').onclick = (e) => {
  const f = e.target.closest('figure'); if (!f) return;
  i = +f.dataset.n; show();
};

$('seg').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  [...$('seg').children].forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  applyFilter(list[i] && list[i].id);
};

document.addEventListener('keydown', (e) => {
  if ($('sheet').classList.contains('on')) { if (e.key === 'Escape') closeSheet(); return; }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  else if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
  else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); togglePick(); }
  else if (e.key === 'Home') { i = 0; show(); }
  else if (e.key === 'End') { i = list.length - 1; show(); }
});

/* 손가락으로 넘기기 */
let tx = 0;
$('stage').addEventListener('touchstart', (e) => { tx = e.changedTouches[0].clientX; }, { passive: true });
$('stage').addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 45) go(dx < 0 ? 1 : -1);
}, { passive: true });

/* ── 고른 것 ── */
function openSheet() {
  const chosen = DATA.filter((d) => picks.has(d.id));
  $('pick-n').textContent = chosen.length ? `${chosen.length}장` : '';
  $('pick-empty').style.display = chosen.length ? 'none' : '';
  $('pick-grid').innerHTML = chosen.map((d) => `
    <a href="${src(d.id)}" target="_blank">
      <img src="${src(d.id)}" loading="lazy" alt="${d.id}">
      <span><b>${d.id}</b> ${d.n}</span></a>`).join('');
  $('pick-text').value = chosen.map((d) => `${d.id}\t${d.n}`).join('\n');
  $('sheet').classList.add('on');
}
const closeSheet = () => $('sheet').classList.remove('on');
$('open-sheet').onclick = openSheet;
$('close-sheet').onclick = closeSheet;
$('copy').onclick = async () => {
  const t = $('pick-text');
  try { await navigator.clipboard.writeText(t.value); $('copy').textContent = '복사됨'; }
  catch (e) { t.select(); document.execCommand('copy'); $('copy').textContent = '복사됨'; }
  setTimeout(() => { $('copy').textContent = '목록 복사'; }, 1200);
};
$('clear').onclick = () => {
  if (!picks.size || !confirm('고른 것을 전부 지울까요?')) return;
  picks.clear(); save(); buildRail(); show(); openSheet();
};

applyFilter();
</script>
</body>
</html>
